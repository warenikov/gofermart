services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      RUN_ADDRESS: ":8080"
      DATABASE_URI: "postgresql://postgres:postgres@db:5432/gofermart?sslmode=disable"
      ACCRUAL_SYSTEM_ADDRESS: "http://accrual:8081"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gofermart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
