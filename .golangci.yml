version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goimports
    - revive
    - gocritic
    - bodyclose
    - noctx
    - misspell
    - whitespace
    - godot

linters-settings:
  goimports:
    local-prefixes: github.com/warenikov/gofermart
  revive:
    rules:
      - name: exported
        severity: warning
        arguments:
          - disableStutteringCheck
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
  godot:
    scope: declarations
    capital: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
    - path: _test\.go
      text: "should have comment"
  max-issues-per-linter: 50
  max-same-issues: 5
